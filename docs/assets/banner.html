<!doctype html>
<!--
  The README banner. To regenerate docs/assets/banner.png (2560x640) from the repository root:
  chrome --headless=new --hide-scrollbars --window-size=2560,640 --virtual-time-budget=5000
         --default-background-color=00000000
         --screenshot=<absolute path>/docs/assets/banner.png <absolute path>/docs/assets/banner.html
  The corners outside the card stay transparent, for dark themes.
  The fonts load from Google Fonts, so the render needs a network connection.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;1,6..72,400&family=Public+Sans:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=block"
  rel="stylesheet"
/>
<style>
  :root {
    --ink: #1b2142;
    --accent: #2f5bd3;
    --bar: #4f3fb8;
    --muted: #4c5470;
    --paper: #f5f6fa;
    --good: #1f7a3d;
    --good-bg: #e7f5ec;
    --warn: #8a5a00;
    --warn-bg: #fff4dc;
    --bad: #b3261e;
    --bad-bg: #fdeceb;
  }
  html, body { margin: 0; width: 2560px; height: 640px; background: transparent; }
  .card {
    box-sizing: border-box; width: 2560px; height: 640px; background: var(--paper);
    border-radius: 28px; display: flex; align-items: center; justify-content: space-between;
    padding: 0 128px;
  }
  .text { width: 1300px; }
  .bar { width: 144px; height: 10px; border-radius: 5px; background: var(--bar); margin-bottom: 44px; }
  h1 {
    font-family: "Newsreader", serif; font-weight: 500; font-size: 172px; line-height: 1;
    color: var(--ink); margin: 0; letter-spacing: -2px;
  }
  .greek {
    font-family: "Newsreader", serif; font-style: italic; font-weight: 400; font-size: 54px;
    color: var(--accent); margin: 18px 0 0 4px;
  }
  .question {
    font-family: "Public Sans", sans-serif; font-weight: 400; font-size: 44px; line-height: 1.45;
    color: var(--muted); margin: 52px 0 0 0;
  }
  .chips { display: flex; flex-direction: column; gap: 26px; width: 930px; }
  .chip {
    display: flex; align-items: center; gap: 24px; border-radius: 18px; padding: 22px 30px;
    font-family: "IBM Plex Mono", monospace; font-size: 30px; white-space: nowrap;
  }
  .handle { overflow: hidden; text-overflow: ellipsis; flex: 1; }
  .verdict {
    font-family: "Public Sans", sans-serif; font-weight: 600; font-size: 26px;
    letter-spacing: 1px; text-transform: uppercase; padding: 8px 18px; border-radius: 999px;
    background: #ffffff;
  }
  .ok { background: var(--good-bg); color: var(--good); }
  .warn { background: var(--warn-bg); color: var(--warn); }
  .bad { background: var(--bad-bg); color: var(--bad); }
</style>
</head>
<body>
  <div class="card">
    <div class="text">
      <div class="bar"></div>
      <h1>Tekmerion</h1>
      <div class="greek">τεκμήριον, a sure sign</div>
      <p class="question">Is every citation in this answer real,<br />and does it quote its source verbatim?</p>
    </div>
    <div class="chips">
      <div class="chip ok"><span class="handle">pmid:30831578/abstract.7~30med</span><span class="verdict">ok</span></div>
      <div class="chip ok"><span class="handle">nct:NCT04363697@2026-06-16/results.outcome.1~…</span><span class="verdict">ok</span></div>
      <div class="chip warn"><span class="handle">“MMR vaccination strongly increases…”</span><span class="verdict">quote mismatch</span></div>
      <div class="chip bad"><span class="handle">pmid:30831578/abstract.7~30mex</span><span class="verdict">forged</span></div>
    </div>
  </div>
</body>
</html>
