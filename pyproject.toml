[project]
name = "tekmeria"
version = "0.1.0"
description = "Biomedical evidence over MCP, cited by handle: every passage is citable and every citation is auditable."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
authors = [{ name = "Pedro Markovicz" }]
keywords = ["mcp", "pubmed", "citations", "rag", "biomedical"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.28,<1",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.15,<3",
    "aiosqlite>=0.22,<1",
    "platformdirs>=4.12,<5",
    "pysbd>=0.3.4,<0.4",
    "structlog>=26.1",
    "anyio>=4.15,<5",
]

[project.urls]
Homepage = "https://github.com/PedroMarkovicz/tekmeria"
Repository = "https://github.com/PedroMarkovicz/tekmeria"
Documentation = "https://github.com/PedroMarkovicz/tekmeria/blob/main/docs/CONTRACT.md"
"Audit view demo" = "https://pedromarkovicz.github.io/tekmeria/"

[project.scripts]
tekmeria = "tekmeria.__main__:main"

[dependency-groups]
dev = [
    "pytest>=9.1",
    "hypothesis>=6.168",
    "jsonschema>=4.26",
    "ruff>=0.16",
    "pyright>=1.1.414",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tekmeria"]

# The sdist ships the project only; untracked local folders (caches, notes) never do.
[tool.hatch.build.targets.sdist]
only-include = [
  "src",
  "tests",
  "schemas",
  "web",
  "docs",
  ".github",
  "pyproject.toml",
  "uv.lock",
  "README.md",
  "LICENSE",
  "NOTICE",
  "CITATION.cff",
  "CHANGELOG.md",
  ".gitignore",
  ".python-version",
]
# Generated before every web build and test; not a source file.
exclude = ["web/src/generated"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-m", "not live", "--strict-markers"]
markers = ["live: calls real upstream APIs; run weekly in CI, never in the default suite"]
filterwarnings = ["error", "ignore::SyntaxWarning", "ignore::DeprecationWarning:pysbd"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["src/tekmeria/demo/fixtures"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "C4", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["tekmeria", "tests"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
include = ["src", "tests"]
strict = ["src/tekmeria/contract"]
