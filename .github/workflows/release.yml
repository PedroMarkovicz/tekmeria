name: release

# A published GitHub release goes to PyPI by trusted publishing: PyPI trusts this workflow's
# identity token, so no PyPI password or API token is stored anywhere. The upload waits in
# the pypi environment for the maintainer's approval.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv python install 3.12
      - run: uv sync --locked
      - name: The release tag must name the package version
        run: test "$GITHUB_REF_NAME" = "v$(uv version --short)"
      - name: The demo page the README links to must be live
        run: curl --fail --silent --show-error --location --output /dev/null https://pedromarkovicz.github.io/tekmeria/
      - run: uv run pytest
      - run: uv build --out-dir dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: pypi
      url: https://pypi.org/project/tekmeria/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
