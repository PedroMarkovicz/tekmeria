name: mutants

# How much of the audit the evaluation exercises: one mutant at a time, run on request.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutants:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv python install 3.12
      - run: uv sync --locked
      - name: Mutation score of the evaluation
        run: uv run python -m tekmerion.evaluation.mutants >> "$GITHUB_STEP_SUMMARY"
