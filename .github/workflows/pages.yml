name: pages

# Publishes the audit view with the offline demo's report (spec 10).
# Manual only for now: Pages needs a public repository (or a paid plan). When the
# repository is public and Pages is set to "GitHub Actions", add this trigger, which
# deploys only after CI passed on main:
#   workflow_run:
#     workflows: [ci]
#     types: [completed]
#     branches: [main]
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false  # a newer run waits; a deployment is never cut short

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked
      - run: uv run medcite demo --json-out site/demo-report.json --html-out site/index.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
